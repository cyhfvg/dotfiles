# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# create by cyhfvg @ 2022/10/09
# rewrite @ 2026/10/06 for kitty 0.49.2 / macOS
# docs: https://sw.kovidgoyal.net/kitty/conf/
#
# 启动示例:
#   kitty --start-as fullscreen
# 热重载: ctrl+cmd+, 或 kill -SIGUSR1 $KITTY_PID

# fonts {{{1
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 18.0

# 光标落在连字上时拆开, 方便编辑.
disable_ligatures cursor

# font_features 使用 PostScript 名, 不是 family 名.
font_features FiraCode-Regular +zero +onum
font_features FiraCode-Medium  +zero +onum
font_features FiraCode-Retina  +zero +onum
font_features FiraCode-Bold    +zero +onum
# }}}

# cursor {{{1
cursor #cccccc
cursor_text_color #111111
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
# cursor_trail 3
# }}}

# scrollback {{{1
scrollback_lines 10000
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier 5.0
# }}}

# mouse {{{1
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 3.0
detect_urls yes
url_style curly
open_url_with default
underline_hyperlinks hover
select_by_word_characters @-./_~?&=%+#
# }}}

# bell {{{1
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
# }}}

# window {{{1
remember_window_size yes
remember_window_position yes
initial_window_width 120c
initial_window_height 35c

hide_window_decorations no
confirm_os_window_close -1
placement_strategy center
window_padding_width 6
window_margin_width 0
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.7

# 分屏优先, 其余布局仍可切换.
enabled_layouts splits,stack,tall,fat,grid
# }}}

# tab bar {{{1
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}[{index}] {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
# }}}

# color schema {{{1
#foreground #dddddd
#background #000000
background_opacity 0.9
dynamic_background_opacity yes
background_blur 16
background_image none

selection_foreground #000000
selection_background #fffacd

# 使用 kitten themes 后可取消下一行注释.
# include current-theme.conf
# }}}

# advanced {{{1
shell .
editor vim
shell_integration enabled

# 必须用 xterm-kitty, 改成 xterm-256color 会丢掉键盘协议/真彩/图形.
term xterm-kitty

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}.sock

allow_hyperlinks yes
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
update_check_interval 24
# }}}

# macos {{{1
macos_option_as_alt left
macos_quit_when_last_window_closed yes
macos_titlebar_color background
macos_show_window_title_in all
macos_colorspace srgb
macos_traditional_fullscreen no
# }}}

# keyboard {{{1
kitty_mod ctrl+shift

## clipboard {{{2
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map cmd+c copy_or_noop
map cmd+v paste_from_clipboard
## }}}

## scrolling {{{2
map kitty_mod+up    scroll_line_up
map kitty_mod+k     scroll_line_up
map kitty_mod+down  scroll_line_down
map kitty_mod+j     scroll_line_down
map kitty_mod+h     show_scrollback
map kitty_mod+g     show_last_command_output
map kitty_mod+z     scroll_to_prompt -1
map kitty_mod+x     scroll_to_prompt 1
map cmd+f           search_scrollback
## }}}

## tabs {{{2
map cmd+t           new_tab_with_cwd
map cmd+w           close_tab
map cmd+shift+]     next_tab
map cmd+shift+[     previous_tab
map cmd+alt+t       set_tab_title
## }}}

## splits {{{2
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current
map cmd+enter       new_window_with_cwd
# close_os_window 保持默认 shift+cmd+w

map cmd+opt+left    neighboring_window left
map cmd+opt+right   neighboring_window right
map cmd+opt+up      neighboring_window up
map cmd+opt+down    neighboring_window down

map kitty_mod+l     next_layout
## }}}

## font size {{{2
map kitty_mod+equal        change_font_size all +2.0
map kitty_mod+plus         change_font_size all +2.0
map kitty_mod+minus        change_font_size all -2.0
map kitty_mod+kp_subtract  change_font_size all -2.0
map kitty_mod+backspace    change_font_size all 0
map cmd+plus               change_font_size all +2.0
map cmd+minus              change_font_size all -2.0
map cmd+0                  change_font_size all 0
## }}}

## hints / misc {{{2
map kitty_mod+e        kitten hints
# 路径 hint 走默认序列: kitty_mod+p>f
map kitty_mod+u        kitten unicode_input
map kitty_mod+escape   kitty_shell window
map kitty_mod+f2       edit_config_file
map ctrl+cmd+,         load_config_file
map cmd+alt+equal      set_background_opacity +0.05
map cmd+alt+minus      set_background_opacity -0.05
map cmd+alt+0          set_background_opacity default
## }}}
# }}}
